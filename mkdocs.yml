theme:
  name: material
  palette:
    - scheme: default
      primary: deep-purple
      accent: deep-purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep-purple
      accent: deep-purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - navigation.footer

markdown_extensions:
  - admonition
  - footnotes
  - meta
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search
  - mermaid2:
      arguments:
        theme: base
        themeVariables:
          primaryColor: "#1a1a3a"
          primaryTextColor: "#e6edf3"
          primaryBorderColor: "#7c3aed"
          lineColor: "#7c3aed"
          secondaryColor: "#0d1117"
          tertiaryColor: "#1a1a2e"
          background: "#0d1117"
          mainBkg: "#1a1a3a"
          nodeBorder: "#7c3aed"
          clusterBkg: "#0f0f23"
          titleColor: "#ffffff"
          edgeLabelBackground: "#1a1a3a"
          fontFamily: "Roboto Mono, Consolas, monospace"

extra_css:
  - stylesheets/theme.css

extra:
  generator: false
